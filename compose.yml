name: express-delivery

services:
  postgres_db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ${DB_MAIN_USER}
      POSTGRES_PASSWORD: ${DB_MAIN_PASS}
      POSTGRES_DB: ${DB_MAIN_NAME}
    command: ["postgres", "-c", "wal_level=logical", "-c", "max_wal_senders=4", "-c", "max_replication_slots=4"]
    ports:
      - '5441:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_MAIN_USER} -d ${DB_MAIN_NAME}']
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - app-network


  postgres_entregadores:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ${DB_ENTREGADORES_USER}
      POSTGRES_PASSWORD: ${DB_ENTREGADORES_PASS}
      POSTGRES_DB: ${DB_ENTREGADORES_NAME}
    ports:
      - '5442:5432'
    volumes:
      - postgres_entregadores_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_ENTREGADORES_USER} -d ${DB_ENTREGADORES_NAME}']
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - app-network

  redis:
    image: redis:7-alpine
    ports:
      - '6380:6379'
    restart: unless-stopped
    networks:
      - app-network

  ms-entregadores:
    build:
      context: .
      dockerfile: ms-entregadores-cs/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      GRPC_PORT: 5001
      METRICS_PORT: 9465
      ConnectionStrings__DefaultConnection: Host=postgres_entregadores;Database=${DB_ENTREGADORES_NAME};Username=${DB_ENTREGADORES_USER};Password=${DB_ENTREGADORES_PASS}
      ConnectionStrings__RedisConnection: redis:6379
      RabbitMQ__Host: rabbitmq
      RabbitMQ__Port: 5672
      RabbitMQ__Username: ${RABBIT_USER}
      RabbitMQ__Password: ${RABBIT_PASS}
      RabbitMQ__AutoAssign: "false"
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4317
      OTEL_SERVICE_NAME: ms-entregadores

    depends_on:
      postgres_entregadores:
        condition: service_healthy
      redis:
        condition: service_started
      rabbitmq:
        condition: service_healthy
    ports:
      - '5001:5001'
    restart: unless-stopped
    networks:
      - app-network

  ms-roteamento:
    build:
      context: .
      dockerfile: ms-roteamento-cs/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      GRPC_PORT: 5002
      METRICS_PORT: 9466
      OSRM_URL: http://osrm-server:5000/
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4317
      OTEL_SERVICE_NAME: ms-roteamento

    depends_on:
      osrm-server:
        condition: service_started
    ports:
      - '5002:5002'
    restart: unless-stopped
    networks:
      - app-network

  osrm-server:
    image: osrm/osrm-backend
    ports:
      - '5080:5000'
    volumes:
      - ./osrm-data:/data
    command: osrm-routed --algorithm mld /data/${OSRM_FILE}
    restart: unless-stopped
    networks:
      - app-network

  api:
    build:
      context: .
      dockerfile: api-node/Dockerfile
    expose:
      - '4000'
    environment:
      DATABASE_URL: postgresql://${DB_MAIN_USER}:${DB_MAIN_PASS}@postgres_db:5432/${DB_MAIN_NAME}?schema=public
      ENTREGADORES_SERVICE_URL: ms-entregadores:5001
      ROTEAMENTO_SERVICE_URL: ms-roteamento:5002
      RECOMENDACAO_SERVICE_URL: ms-recomendacao:50053
      JWT_SECRET: ${JWT_SECRET}
      RABBIT_USER: ${RABBIT_USER}
      RABBIT_PASS: ${RABBIT_PASS}
      RABBIT_HOST: rabbitmq
      REDIS_HOST: redis
      REDIS_PORT: 6379
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4317
      OTEL_SERVICE_NAME: api-node

    depends_on:
      postgres_db:
        condition: service_healthy
      ms-entregadores:
        condition: service_started
      ms-roteamento:
        condition: service_started
      ms-recomendacao:
        condition: service_started
      rabbitmq:
        condition: service_healthy
    volumes:
      - ./api-node:/app
      - /app/node_modules
      - ./protos:/app/protos
    command: sh -c "npm install && npx prisma generate && npx prisma db push --force-reset && npx prisma db seed && npm run dev"
    restart: unless-stopped
    networks:
      - app-network

  web:
    build:
      context: ./frontend-web
      dockerfile: Dockerfile
    environment:
      # O Dockerfile serve o build estático por nginx, cujo template faz
      # listen ${PORT}. Sem esta variável o nginx aborta no boot com
      # "host not found in ${PORT}" e o frontend simplesmente não sobe.
      PORT: 5173
    ports:
      - '5173:5173'
    depends_on:
      - api
    restart: unless-stopped
    networks:
      - app-network

  kong:
    build:
      context: .
      dockerfile: kong/Dockerfile
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /usr/local/kong/declarative/kong.yml
      KONG_LOG_LEVEL: notice
      KONG_VAULT_ENV_PREFIX: SECRET_
      SECRET_JWT_SECRET: ${JWT_SECRET}
      # Mesma imagem e mesma configuração de produção; só o upstream muda.
      API_URL: http://api:4000/
    ports:
      - '8000:8000'
    depends_on:
      - api
    networks:
      - app-network

  rabbitmq:
    image: rabbitmq:3-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBIT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBIT_PASS}
    ports:
      - '5672:5672'
      - '15672:15672'
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_running"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - app-network

  # ───────────────────────────────────────────────────────────────────────────
  # Change Data Capture: PostgreSQL -> Debezium -> Kafka -> ms-recomendacao
  # a replicação do catálogo é derivada do WAL, não publicada pela aplicação
  # ───────────────────────────────────────────────────────────────────────────
  kafka:
    image: confluentinc/cp-kafka:7.6.0
    environment:
      # Modo KRaft: broker e controller no mesmo processo, sem Zookeeper.
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_LISTENERS: PLAINTEXT://kafka:9092,CONTROLLER://kafka:29093,PLAINTEXT_HOST://0.0.0.0:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    ports:
      - '29092:29092'
    healthcheck:
      test: ['CMD', 'kafka-broker-api-versions', '--bootstrap-server', 'kafka:9092']
      interval: 10s
      timeout: 10s
      retries: 12
    restart: unless-stopped
    networks:
      - app-network

  debezium-connect:
    image: debezium/connect:2.4
    environment:
      BOOTSTRAP_SERVERS: kafka:9092
      GROUP_ID: delivery-connect
      CONFIG_STORAGE_TOPIC: connect_configs
      OFFSET_STORAGE_TOPIC: connect_offsets
      STATUS_STORAGE_TOPIC: connect_statuses
      CONFIG_STORAGE_REPLICATION_FACTOR: 1
      OFFSET_STORAGE_REPLICATION_FACTOR: 1
      STATUS_STORAGE_REPLICATION_FACTOR: 1
      KEY_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      VALUE_CONVERTER: org.apache.kafka.connect.json.JsonConverter
    ports:
      - '8084:8083'
    depends_on:
      kafka:
        condition: service_healthy
      postgres_db:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'curl -sf http://localhost:8083/connectors || exit 1']
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped
    networks:
      - app-network

  # Registra o connector automaticamente. Sem isso o Kafka sobe mas nenhum dado
  # flui — era exatamente esse o "falta configurar o Kafka" da entrega anterior.
  debezium-connector-init:
    image: curlimages/curl:8.10.1
    depends_on:
      debezium-connect:
        condition: service_healthy
    environment:
      DB_USER: ${DB_MAIN_USER}
      DB_PASS: ${DB_MAIN_PASS}
      DB_NAME: ${DB_MAIN_NAME}
    volumes:
      - ./debezium:/debezium:ro
    entrypoint: ['/bin/sh', '/debezium/register-connector.sh']
    restart: on-failure
    networks:
      - app-network

  kafka-ui:
    image: ghcr.io/kafbat/kafka-ui:latest
    environment:
      KAFKA_CLUSTERS_0_NAME: express-delivery
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      KAFKA_CLUSTERS_0_KAFKACONNECT_0_NAME: debezium
      KAFKA_CLUSTERS_0_KAFKACONNECT_0_ADDRESS: http://debezium-connect:8083
      DYNAMIC_CONFIG_ENABLED: 'true'
    ports:
      - '8080:8080'
    depends_on:
      kafka:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - app-network

  ms-notificacoes:
    build:
      context: .
      dockerfile: ms-notificacoes-py/Dockerfile
    environment:
      RABBIT_HOST: rabbitmq
      RABBIT_PORT: 5672
      RABBIT_USER: ${RABBIT_USER}
      RABBIT_PASS: ${RABBIT_PASS}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
    depends_on:
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - app-network

  postgres_recomendacao:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ${DB_RECOMENDACAO_USER}
      POSTGRES_PASSWORD: ${DB_RECOMENDACAO_PASS}
      POSTGRES_DB: ${DB_RECOMENDACAO_NAME}
    ports:
      - '5443:5432'
    # Estado derivado mora em tmpfs de propósito: tudo aqui é reconstruído pelo
    # replay do tópico Kafka a cada subida. Persistir a réplica só criaria deriva,
    # porque o `prisma db push --force-reset` do api derruba o schema da origem e
    # DDL não é capturado por logical decoding — as linhas somem sem gerar evento
    # de delete, e a réplica ficaria com órfãos até o id ser reutilizado.
    #
    # Só declarar `volumes: []` não bastaria: a imagem do Postgres tem VOLUME no
    # Dockerfile, e o Docker criaria um volume anônimo que sobrevive ao down.
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_RECOMENDACAO_USER} -d ${DB_RECOMENDACAO_NAME}']
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - app-network

  ms-recomendacao:
    build:
      context: .
      dockerfile: ms-recomendacao-py/Dockerfile
    environment:
      DATABASE_URL: postgresql://${DB_RECOMENDACAO_USER}:${DB_RECOMENDACAO_PASS}@postgres_recomendacao:5432/${DB_RECOMENDACAO_NAME}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4317
      OTEL_SERVICE_NAME: ms-recomendacao

    depends_on:
      postgres_recomendacao:
        condition: service_healthy
      kafka:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - app-network


  jaeger:
    image: jaegertracing/all-in-one:latest
    environment:
      MEM_STORAGE_MAX_TRACES: 10000
    ports:
      - "16686:16686"
      - "4317:4317"
      - "4318:4318"
    restart: unless-stopped
    networks:
      - app-network

  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    restart: unless-stopped
    networks:
      - app-network

  grafana:
    image: grafana/grafana-oss:latest
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    restart: unless-stopped
    networks:
      - app-network


networks:
  # Sem subnet fixa de propósito: fixar um /16 colide com qualquer outro projeto
  # Docker na mesma máquina que ocupe a mesma faixa, e o compose passa a falhar
  # com "Pool overlaps with other one on this address space". Os serviços se
  # encontram por DNS do Compose (osrm-server, kafka, postgres_db, ...).
  app-network:
    driver: bridge

volumes:
  postgres_data:
  postgres_entregadores_data:
