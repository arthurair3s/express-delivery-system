enum StatusEntregador {
  OFFLINE
  DISPONIVEL
  EM_ENTREGA
}

type Entregador {
  id: ID!
  nome: String
  telefone: String
  veiculo: String
  status: StatusEntregador
  latitude: Float
  longitude: Float
}

extend type Query {
  entregadores: [Entregador] @auth
  entregador(id: ID!): Entregador @auth
  buscarEntregadoresProximos(
    latitude: Float!
    longitude: Float!
    raioKm: Float!
  ): [Entregador] @auth

  # busca entregadores automaticamente com base no id do restaurante
  entregadoresProximosAoRestaurante(
    restauranteId: ID!
    raioKm: Float!
  ): [Entregador] @auth
}

extend type Mutation {
  criarEntregador(nome: String, telefone: String, veiculo: String): Entregador @auth(roles: ["ENTREGADOR"])

  editarEntregador(
    id: ID!
    nome: String
    telefone: String
    veiculo: String
  ): Entregador @auth(roles: ["ENTREGADOR"])

  deletarEntregador(id: ID!): Boolean @auth(roles: ["ENTREGADOR"])

  atualizarStatusEntregador(id: ID!, novoStatus: StatusEntregador!): Entregador @auth(roles: ["ENTREGADOR"])

  atualizarLocalizacaoEntregador(
    id: ID!
    latitude: Float!
    longitude: Float!
  ): Boolean @auth(roles: ["ENTREGADOR"])

  # Utilitário de simulação, deliberadamente aberto a qualquer autenticado.
  #
  # Cria uma frota fictícia para que dê para exercitar atribuição de corridas,
  # rastreamento e roteamento sem precisar de entregadores reais cadastrados. Não
  # tem uso fora de desenvolvimento, e num ambiente exposto ao público seria
  # restrito a um perfil administrativo ou removido do schema.
  povoarFrota: Boolean @auth
}
