type Pedido {
  id: ID!
  usuario: UsuarioPublico
  restaurante_id: ID
  status: String
  valor_total: Float
  destino_latitude: Float
  destino_longitude: Float
  data_criacao: String
  itens: [ItemPedido]
}

extend type Usuario {
  pedidos: [Pedido]
}

extend type Query {
  pedidos: [Pedido] @auth(roles: ["RESTAURANTE"])
  pedido(id: ID!): Pedido @auth
  pedidosPorRestaurante(restaurante_id: ID!): [Pedido] @auth(roles: ["RESTAURANTE"])

  # Substitui o antigo `usuario(id) { pedidos }`: o dono vem do token, não do argumento.
  meusPedidos: [Pedido] @auth
}

extend type Mutation {
  # `usuario_id` foi removido de propósito: o dono do pedido é o portador do
  # token. `status` e `data_criacao` também saíram — eram ignorados pelo caso de
  # uso e permitiam ao cliente forjar um pedido já confirmado.
  criarPedido(
    restaurante_id: ID!
    valor_total: Float
    destino_latitude: Float
    destino_longitude: Float
  ): Pedido @auth

  editarPedido(
    id: ID!
    usuario_id: ID
    restaurante_id: ID
    status: String
    valor_total: Float
    destino_latitude: Float
    destino_longitude: Float
    data_criacao: String
  ): Pedido @auth(roles: ["RESTAURANTE"])

  deletarPedido(id: ID!): Boolean @auth(roles: ["RESTAURANTE"])
}
