type Usuario {
  id: ID!
  nome: String!
  email: String!
  telefone: String
  latitude: Float
  longitude: Float
  endereco: String
  role: String
  entregador_id: Int
  restaurante_id: Int
}

type LoginResponse {
  token: String!
  usuario: Usuario!
}

# Projeção mínima de um usuário, para quando ele aparece como parte do recurso
# de outra pessoa: o lojista precisa saber para quem entregar, não o e-mail, o
# telefone nem as coordenadas de casa do cliente.
#
# Sem esta separação, `pedidosPorRestaurante { usuario { ... } }` alcançava a PII
# completa e, por `Usuario.pedidos`, o histórico do cliente nos concorrentes.
type UsuarioPublico {
  id: ID!
  nome: String!
  endereco: String
}

extend type Query {
  # `usuarios` e `usuario(id)` foram removidas: nenhuma tela as consumia, e
  # juntas davam a qualquer autenticado a lista completa de usuários e a leitura
  # de qualquer conta pelo id. O acesso à própria conta é `me`; os próprios
  # pedidos, `meusPedidos`.
  me: Usuario @auth
}

extend type Mutation {
  login(email: String!, senha: String!): LoginResponse

  criarUsuario(
    nome: String!
    email: String!
    telefone: String
    senha: String!
    role: String
    entregador_id: Int
    restaurante_id: Int
  ): Usuario

  # Sem `role`/`entregador_id`/`restaurante_id`: são campos administrativos e,
  # numa mutation que o próprio usuário executa, seriam escalada de privilégio.
  editarUsuario(
    id: ID!
    nome: String
    email: String
    telefone: String
    senha: String
  ): Usuario @auth

  atualizarEndereco(
    latitude: Float
    longitude: Float
    endereco: String!
  ): Usuario @auth

  deletarUsuario(id: ID!): Boolean @auth
}

