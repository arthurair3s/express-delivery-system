type Avaliacao {
  id: ID!
  usuario: UsuarioPublico!
  restaurante: Restaurante!
  nota: Int
  comentario: String
}

extend type Usuario {
  avaliacoes: [Avaliacao]
}

extend type Restaurante {
  avaliacoes: [Avaliacao]
}

extend type Query {
  avaliacoes: [Avaliacao]
  avaliacao(id: ID!): Avaliacao
}

extend type Mutation {
  # `usuario_id` removido: o autor da avaliação é o portador do token.
  criarAvaliacao(
    restaurante_id: ID!
    nota: Int
    comentario: String
  ): Avaliacao @auth

  editarAvaliacao(
    id: ID!
    nota: Int
    comentario: String
  ): Avaliacao @auth

  deletarAvaliacao(id: ID!): Boolean @auth
}
